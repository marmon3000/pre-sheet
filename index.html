<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>事前シート</title>
<style>
:root{--bg:#f6f5f1;--panel:#fff;--ink:#1f2328;--sub:#5b6470;--line:#dedbd2;--accent:#1f6f6b;--warn:#8a4b12}
@media (prefers-color-scheme:dark){:root{--bg:#15181b;--panel:#1d2125;--ink:#e6e8ea;--sub:#9aa4ae;--line:#30363c;--accent:#6cc5bf;--warn:#e7b77a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif}
main{max-width:420px;margin:12vh auto 0;padding:0 16px}
form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px 20px}
h1{font-size:20px;margin:0 0 8px}
p{margin:6px 0;font-size:14px;color:var(--sub)}
input{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:10px 0}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;border:1px solid var(--accent);background:var(--accent);color:var(--panel);border-radius:8px;padding:6px 20px;cursor:pointer}
button:disabled{opacity:.5}
#err{color:var(--warn);min-height:1.8em}
footer{font-size:12px;color:var(--sub);margin-top:16px}
</style>
</head>
<body>
<main>
<form id="f">
<h1>事前シート</h1>
<p>URL と一緒に届いたパスワードを入力してください。</p>
<label for="pw" style="font-size:14px">パスワード</label>
<input type="password" id="pw" autocomplete="off" autocapitalize="off" spellcheck="false" required>
<button type="submit" id="go">開く</button>
<p id="err" role="alert"></p>
</form>
<footer>このページは個人が作成したものです。</footer>
</main>

  var KEY='pre-sheet-pw';
  var f=document.getElementById('f'),pw=document.getElementById('pw'),go=document.getElementById('go'),err=document.getElementById('err');
  function bytes(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
  function open(pass){
    var enc=new TextEncoder();
    return crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']).then(function(k){
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(SALT),iterations:ITER,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);

      return crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(IV)},k,bytes(DATA));
    }).then(function(buf){return new TextDecoder().decode(buf)});
  }
  function show(html){document.open();document.write(html);document.close()}
  function attempt(pass,quiet){
    go.disabled=true;err.textContent=quiet?'':'開いています…';
    return open(pass).then(function(html){
      try{localStorage.setItem(KEY,pass)}catch(e){}
      show(html);
    },function(){
      go.disabled=false;
      if(quiet){try{localStorage.removeItem(KEY)}catch(e){}}
      else{err.textContent='パスワードが違います';pw.select()}
    });
  }
  if(!(window.crypto&&crypto.subtle&&window.TextEncoder)){
    go.disabled=true;err.textContent='このブラウザでは開けません。別のブラウザで開いてください';return;
